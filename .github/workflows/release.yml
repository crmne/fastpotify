name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio. projectm-sys only knows how to build
          # libprojectM for x64 there, so this build goes without MilkDrop.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            features: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows' && matrix.features == ''
        run: vcpkg install glew:x64-windows-static
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. Both
      # Windows jobs also use dumpbin below to inspect the finished binary.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # v2: caches from before the projectm-sys fork replay its stale
          # build output instead of compiling the fork.
          prefix-key: v2
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\fastpotify.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Fastpotify imports an MSVC runtime:`n$runtime" }

      - name: Package
        shell: bash
        run: |
          name="fastpotify-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fastpotify.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/fastpotify" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp -r packaging "dist/$name/"
            rm -rf "dist/$name/packaging/macos"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\fastpotify.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\fastpotify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal app
    runs-on: macos-latest
    env:
      # Signing and notarization run only when the Apple credentials exist as
      # repository secrets; without them the DMG ships unsigned and the
      # download page explains the Privacy & Security dance.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/fastpotify \
            target/x86_64-apple-darwin/release/fastpotify \
            -output universal/fastpotify

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/macos/bundle.sh universal/fastpotify Fastpotify.app "$version"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Sign
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" Fastpotify.app

      - name: DMG
        run: |
          name="fastpotify-${GITHUB_REF_NAME}-macos-universal"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R Fastpotify.app "$stage/"
          cp README.md LICENSE "$stage/"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          hdiutil create -volname Fastpotify -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"

      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          name="fastpotify-${GITHUB_REF_NAME}-macos-universal"
          xcrun notarytool submit "dist/$name.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/$name.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/fastpotify-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak
          mv packaging/flatpak/fastpotify-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.fastpotify.Fastpotify.bundle.yml
          bundle: fastpotify-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: GitHub release
    # The bundle is welcome but not required: a Flatpak failure must not
    # hold the release.
    needs: [build, macos, flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a suffix (v0.4.0-rc1) is a pre-release: it stays
          # off "latest", so the app's update check never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}
