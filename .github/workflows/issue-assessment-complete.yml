name: Mark completed issue assessment

on:
  workflow_run:
    workflows: [Copilot issue assessment]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  discussions: write

jobs:
  mark-complete:
    if: >-
      vars.COPILOT_ISSUE_ASSESSMENT_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find the assessed subject
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { targetArtifactName } = require('./.github/scripts/issue-assessment.cjs');
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            // Filtered events have no assessment and therefore no marker.
            core.setOutput('name', targetArtifactName(artifacts, run.run_attempt));
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.target.outputs.name != ''
        with:
          name: ${{ steps.target.outputs.name }}
          path: ${{ runner.temp }}/assessment-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Mark successful assessment
        if: steps.target.outputs.name != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const target = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'assessment-target', 'assessment-target.json'), 'utf8'));
            const { complete } = require('./.github/scripts/issue-assessment.cjs');
            await complete({ github, context, target });
